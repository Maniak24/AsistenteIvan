name: Build Asistente Ivan

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;35.0.1 ndk;29.0.13113456'

      - name: Instalar SDK
        run: echo "Android SDK preparado"

      - name: CMake
        uses: lukka/get-cmake@latest
        with:
          cmakeVersion: 3.31.6

      - name: Permisos Gradle
        run: chmod +x gradlew

      - name: Build APK
        uses: gradle/actions/setup-gradle@v4
        with:
          validate-wrappers: false

      - name: Compilar
        run: ./gradlew assembleDebug

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: Asistente-Ivan-debug
          path: app/build/outputs/apk/debug/*.apk
